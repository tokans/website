<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate · Tokans</title>
  <meta name="description" content="Pay it forward. Fund access and support for professionals rebuilding their careers in the AI era. Anonymous-friendly — no account required." />
  <link rel="canonical" href="https://tokans.org/donate" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Syne:wght@600;700;800&family=DM+Mono:wght@400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="static-stage">

    <!-- Shared header (injected from chrome.js) -->
    <div data-chrome="header" data-back-href="/" data-back-label="Home"></div>

    <!-- Two-column: image-backed use-case panel + dynamic form island -->
    <div class="split">

      <!-- Left: image-backed use-case panel -->
      <aside class="split-media">
        <img class="split-media-img" src="/images/profile.png" alt="" aria-hidden="true" />
        <div class="split-media-body">
          <div class="split-eyebrow">Support the mission</div>
          <h1 class="split-title">Pay it forward</h1>
          <p class="split-sub">
            Fund access and support for professionals rebuilding their careers in the AI era. AI needs Tokens. Humans need Tokans.
          </p>
          <ul class="split-points">
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Anonymous-friendly — no account required</span></li>
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Funds professional access and support</span></li>
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Every contribution is pay-it-forward</span></li>
          </ul>
        </div>
      </aside>

      <!-- Right: dynamic form island -->
      <main class="split-panel">
        <div id="donate-island" class="split-panel-inner" style="--split-panel-max-w:480px"></div>
      </main>
    </div>
  </div>

  <!-- Shared footer (injected from chrome.js) -->
  <div data-chrome="footer"></div>

  <script type="module" src="/js/chrome.js"></script>
  <script type="module" src="/js/donate.js"></script>
</body>
</html>
