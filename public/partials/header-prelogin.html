<!--
  PRE-LOGIN marketing navbar - shown on the static public/*.html pages.
  Single source of truth; edit by hand.

  Because the static pages load with NO build step, this header is consumed via
  build-time codegen: `npm run build:partials` reads this file into
  public/js/partials.generated.js, which public/js/chrome.js imports
  synchronously (so the top of the page never flashes empty). After editing,
  re-run `npm run build:partials` (it also runs as part of `prelocal` / `build`).

  The hamburger / mobile-menu / scroll behaviour is wired by chrome.js - keep the
  element ids (navbar, navHamburger, navMobileMenu, navBackdrop) in sync with it.
-->
<nav id="navbar" aria-label="Main navigation">
  <a href="/" class="nav-logo" aria-label="Tokans home">
    <img src="/images/logo.png" alt="" class="nav-logo-img" aria-hidden="true" />Tok<span class="logo-ans"><i><u>ans</u></i></span>
  </a>
  <div class="nav-actions">
    <a href="/founders" class="nav-link">Builders</a>
    <a href="/partners" class="nav-link">Partners</a>
    <a href="/join" class="nav-link nav-link--engineers">Contributors</a>
    <a href="/login" class="btn btn-primary nav-cta">Sign In / Sign Up</a>
    <button class="nav-hamburger" id="navHamburger" aria-label="Open menu" aria-expanded="false" aria-controls="navMobileMenu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile-menu" id="navMobileMenu" aria-hidden="true" role="dialog" aria-label="Navigation menu">
    <a href="/founders" class="nav-mobile-link">Builders</a>
    <a href="/partners" class="nav-mobile-link">Partners</a>
    <a href="/join" class="nav-mobile-link">Contributors</a>
    <div class="nav-mobile-actions">
      <a href="/login" class="btn btn-primary">Sign In / Sign Up</a>
    </div>
  </div>
  <div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>
</nav>
