<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#g)"/>
  <!-- Briefcase: a "work" mark, distinct from myFinance's rupee glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle -->
    <path d="M420 340 v-44 a44 44 0 0 1 44 -44 h96 a44 44 0 0 1 44 44 v44"/>
    <!-- case body -->
    <rect x="248" y="340" width="528" height="396" rx="56" fill="#ffffff" stroke="none"/>
  </g>
  <!-- latch detail cut into the case -->
  <g fill="url(#g)">
    <rect x="468" y="500" width="88" height="76" rx="20"/>
  </g>
  <!-- divider band across the case -->
  <rect x="248" y="476" width="528" height="36" fill="url(#g)" opacity="0.18"/>
</svg>
