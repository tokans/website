<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Tokans</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Syne:wght@600;700;800&family=DM+Mono:wght@400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="static-stage">

    <div data-chrome="header"></div>

    <div class="split split--solo" style="min-height:calc(100vh - 64px)">
      <main class="split-panel" style="display:flex;align-items:center;justify-content:center;padding:48px 24px">
        <div class="split-panel-inner ui-fade-in" style="--split-panel-max-w:440px;width:100%;max-width:440px">
          <div class="ui-card" style="--ui-card-max-w:440px">

            <div class="auth-header">
              <span class="wordmark" style="font-size:26px">Tok<span class="wordmark-ans">ans</span></span>
              <div class="auth-title" id="reset-title">Set a new password</div>
              <div class="auth-subtitle">Choose a strong password for your account.</div>
            </div>

            <div id="reset-invalid" hidden>
              <div class="auth-error" style="display:block;margin-bottom:16px">
                This reset link has expired or is invalid. <a href="/login" class="auth-terms-link">Request a new one</a>.
              </div>
            </div>

            <form id="reset-form" novalidate>
              <div class="ui-field">
                <label class="ui-field-label">New Password</label>
                <input class="ui-input" type="password" id="reset-password" placeholder="At least 8 characters" autocomplete="new-password" />
                <div class="ui-field-error" id="err-reset-password"></div>
              </div>
              <div class="ui-field">
                <label class="ui-field-label">Confirm Password</label>
                <input class="ui-input" type="password" id="reset-confirm" placeholder="Repeat password" autocomplete="new-password" />
                <div class="ui-field-error" id="err-reset-confirm"></div>
              </div>

              <div class="auth-error" id="reset-error" hidden></div>

              <button type="submit" class="ui-btn ui-btn--primary ui-btn--full" id="reset-submit">Set new password →</button>
            </form>

            <div id="reset-success" hidden style="text-align:center;padding:24px 0">
              <div class="auth-success" style="margin-top:0;margin-bottom:20px">
                Your password has been updated. You can now sign in.
              </div>
              <a href="/login" class="ui-btn ui-btn--primary ui-btn--full" style="text-decoration:none;text-align:center;display:block">Sign in →</a>
            </div>

          </div>
          <div class="auth-terms">
            <a href="/terms" class="auth-terms-link">Terms of Service</a> · <a href="/privacy" class="auth-terms-link">Privacy Policy</a>
          </div>
        </div>
      </main>
    </div>

    <div data-chrome="footer"></div>
  </div>

  <script type="module" src="/js/chrome.js"></script>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
