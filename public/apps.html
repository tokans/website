<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps · Tokans</title>
  <meta name="description" content="Apps supported by professionals on the Tokans network. Any app built on sharedCoreLib is eligible to be listed. Browse the directory, or list your own." />
  <link rel="canonical" href="https://tokans.org/apps" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Syne:wght@600;700;800&family=DM+Mono:wght@400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="static-stage">

    <div data-chrome="header" data-back-href="/" data-back-label="Home"></div>

    <div class="split">

      <!-- Left: image-backed use-case panel -->
      <aside class="split-media">
        <img class="split-media-img" src="/images/dev.png" alt="" aria-hidden="true" />
        <div class="split-media-body">
          <div class="split-eyebrow">Apps on the Tokans network</div>
          <h1 class="split-title">Apps supported by professionals</h1>
          <p class="split-sub">
            Browse the directory, or list your own.
          </p>
          <ul class="split-points">
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Every app built using <a href="https://www.github.com/tokans/sharedCoreLib" target="_blank">sharedCoreLib</a> is automatically eligible to be listed</span></li>
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Owners initiate an acceptance workflow to get listed</span></li>
            <li class="split-point"><span class="split-check" aria-hidden="true">✓</span><span>Supported by verified professionals on the network</span></li>
          </ul>
        </div>
      </aside>

      <!-- Right: dynamic directory carousel -->
      <main class="split-panel">
        <div id="apps-island" class="split-panel-inner split-panel-inner--top" style="--split-panel-max-w:560px"></div>
      </main>
    </div>
  </div>

  <div data-chrome="footer"></div>

  <script type="module" src="/js/chrome.js"></script>
  <script type="module" src="/js/apps.js"></script>
</body>
</html>
